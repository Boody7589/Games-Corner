<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>ركن الألعاب</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&amp;family=Readex+Pro:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF0E4}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:var(--blob);animation:drift 9s ease-in-out infinite;pointer-events:none}
@keyframes drift{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.06)}}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{font:500 16px 'Readex Pro',sans-serif;min-height:46px;padding:0 22px;border:0;border-radius:999px;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,background .25s ease;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 8px 0 var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.fld:focus-visible{outline:3px solid #86AE95;outline-offset:2px}
.b-main{background:var(--accent);color:var(--accentink)}
.b-dark{background:var(--dark);color:var(--darkink)}
.b-soft{background:var(--chip);color:var(--ink)}
.b-bad{background:var(--bad);color:var(--badink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s ease,box-shadow .3s ease;animation:pop .5s ease both}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 0 var(--shadow)}
.fld{width:100%;box-sizing:border-box;font:400 16px 'Readex Pro',sans-serif;color:var(--ink);background:var(--field);border:2px solid var(--fieldline);border-radius:16px;padding:12px 14px;min-height:46px}
.panel{background:var(--panel);border:2px dashed var(--panelline);border-radius:28px;padding:26px;margin-bottom:36px}
.ttl{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800}
@media (prefers-reduced-motion:reduce){.blob,.card{animation:none}.btn,.card{transition:none}}
</style>
</helmet>
<div dir="rtl" style="{{themeVars}};position:relative;overflow:hidden;min-height:100vh;box-sizing:border-box;font-family:'Readex Pro',sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;transition:background .4s ease,color .4s ease">
<div class="blob" style="width:280px;height:280px;background:#F4C86A;top:-80px;right:-60px"></div>
<div class="blob" style="width:200px;height:200px;background:#86AE95;top:300px;left:-80px;animation-delay:-3s"></div>
<div class="blob" style="width:150px;height:150px;background:#F0A6B8;top:140px;left:38%;animation-delay:-6s"></div>
<div style="position:relative;max-width:1180px;margin:0 auto;padding:24px 24px 48px">

<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
<div class="ttl" style="font-size:30px;flex:0 0 auto">ركن الألعاب</div>
<div style="flex:1 1 260px;min-width:0"><input class="fld" type="search" aria-label="ابحث عن لعبة" placeholder="ابحث عن لعبة…" value="{{q}}" onInput="{{onSearch}}" style="border-radius:999px;padding-inline:20px"></div>
<button class="btn b-soft" onClick="{{toggleTheme}}">{{themeLabel}}</button>
<sc-if value="{{canEdit}}" hint-placeholder-val="{{ false }}"><button class="btn b-dark" onClick="{{toggleAdmin}}">{{adminLabel}}</button></sc-if>
</div>

<div style="padding:56px 0 36px;max-width:740px">
<div class="ttl" style="font-size:clamp(36px,6vw,60px);line-height:1.15">تعالى العب… <span style="color:var(--accent)">الدنيا هادية هنا</span></div>
<p style="font-size:19px;margin:16px 0 0;color:var(--soft)">مجموعة ألعابي وتطبيقات الويب اللي عملتها بإيدي. اختار واحدة وابدأ.</p>
</div>

<sc-if value="{{askPw}}" hint-placeholder-val="{{ false }}">
<div class="panel" style="max-width:460px">
<label>اكتب الباسوورد عشان تفتح لوحة التحكم<input class="fld" type="password" dir="ltr" value="{{pw}}" onInput="{{onPw}}"></label>
<div style="display:flex;gap:12px;align-items:center;margin-top:14px"><button class="btn b-main" onClick="{{unlock}}">افتح</button><span style="color:var(--accent)">{{pwMsg}}</span></div>
</div>
</sc-if>

<sc-if value="{{showAdmin}}" hint-placeholder-val="{{ false }}">
<div class="panel">
<div class="ttl" style="font-size:26px;margin-bottom:16px">{{formTitle}}</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
<label>اسم اللعبة<input class="fld" value="{{f.title}}" onInput="{{onTitle}}"></label>
<label>رابط اللعبة (اللي بيشغلها)<input class="fld" dir="ltr" placeholder="https://" value="{{f.url}}" onInput="{{onUrl}}"></label>
<label>صورة اللعبة (ارفعها من جهازك)<input class="fld" type="file" accept="image/*" onChange="{{onFile}}"></label>
<label>النوع<select class="fld" onChange="{{onKind}}"><option value="لعبة" selected="{{f.isGame}}">لعبة</option><option value="ويب اب" selected="{{f.isApp}}">ويب اب</option></select></label>
</div>
<label style="display:block;margin-top:14px">الوصف<textarea class="fld" rows="3" onInput="{{onDesc}}">{{f.desc}}</textarea></label>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px">
<button class="btn b-main" onClick="{{save}}">{{saveLabel}}</button>
<sc-if value="{{editing}}" hint-placeholder-val="{{ false }}"><button class="btn b-soft" onClick="{{cancelEdit}}">إلغاء التعديل</button></sc-if>
<span style="color:var(--accent)">{{msg}}</span>
</div>
<div class="ttl" style="font-size:24px;margin:34px 0 14px">نبذة وروابط التواصل</div>
<label style="display:block">نبذة عنا<textarea class="fld" rows="3" onInput="{{onAbout}}">{{st.about}}</textarea></label>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px">
<label>رابط انستجرام<input class="fld" dir="ltr" placeholder="https://instagram.com/…" value="{{st.ig}}" onInput="{{onIg}}"></label>
<label>رابط فيسبوك<input class="fld" dir="ltr" placeholder="https://facebook.com/…" value="{{st.fb}}" onInput="{{onFb}}"></label>
<label>رابط يوتيوب<input class="fld" dir="ltr" placeholder="https://youtube.com/…" value="{{st.yt}}" onInput="{{onYt}}"></label>
<label>رابط تيك توك<input class="fld" dir="ltr" placeholder="https://tiktok.com/@…" value="{{st.tt}}" onInput="{{onTt}}"></label>
<label>إيميل جيميل<input class="fld" dir="ltr" placeholder="name@gmail.com" value="{{st.mail}}" onInput="{{onMail}}"></label>
</div>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:18px">
<button class="btn b-main" onClick="{{saveSite}}">احفظ النبذة والروابط</button>
<span style="color:var(--accent)">{{siteMsg}}</span>
</div>
</div>
</sc-if>

<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px">
<sc-for list="{{filters}}" as="ft" hint-placeholder-count="3">
<button class="btn" style="{{ft.style}}" onClick="{{ft.pick}}">{{ft.label}}</button>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px">
<sc-for list="{{shown}}" as="g" hint-placeholder-count="3">
<div class="card">
<div style="height:180px;background:linear-gradient(135deg,#F4C86A,#F0A6B8);position:relative">
<sc-if value="{{g.hasImage}}" hint-placeholder-val="{{ false }}"><img alt="{{g.title}}" src="{{g.image}}" style="width:100%;height:100%;object-fit:cover;display:block"></sc-if>
<span style="position:absolute;top:12px;right:12px;background:#3B2B3F;color:#FFF9F2;font-size:13px;padding:2px 12px;border-radius:999px">{{g.kind}}</span>
</div>
<div style="padding:20px;display:flex;flex-direction:column;gap:8px;flex:1">
<div class="ttl" style="font-size:24px;line-height:1.3">{{g.title}}</div>
<div style="color:var(--soft);flex:1;white-space:pre-line">{{g.desc}}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
<a class="btn b-main" href="{{g.url}}" target="_blank">العب الآن</a>
<sc-if value="{{showAdmin}}" hint-placeholder-val="{{ false }}">
<button class="btn b-soft" onClick="{{g.edit}}">تعديل</button>
<button class="btn b-bad" onClick="{{g.remove}}">حذف</button>
</sc-if>
</div>
</div>
</div>
</sc-for>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="text-align:center;padding:56px 16px;color:var(--soft);font-size:18px">{{emptyText}}</div>
</sc-if>

<div id="about" style="margin-top:72px;background:var(--card);border:2px solid var(--line);border-radius:32px;padding:36px;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center">
<div class="ttl" style="font-size:36px;flex:0 0 auto">نبذة عنا</div>
<p style="margin:0;flex:1 1 320px;font-size:18px;color:var(--soft);white-space:pre-line">{{aboutText}}</p>
</div>

<div style="margin-top:48px;padding-top:28px;border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
<div style="color:var(--soft)">اتعمل بحب وقهوة</div>
<div style="display:flex;flex-wrap:wrap;gap:10px">
<sc-for list="{{socials}}" as="so" hint-placeholder-count="3">
<a class="btn b-soft" href="{{so.href}}" target="_blank">{{so.name}}</a>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1500}}'>
class Component extends DCLogic {
  state = { dark: false, q: '', askPw: false, pw: '', pwMsg: '', unlocked: false, games: [], filter: 'all', canEdit: true, admin: false, editingId: null, msg: '', siteMsg: '',
    f: { title: '', url: '', image: '', desc: '', kind: 'لعبة' }, site: {}, st: {} };
  async getDb() {
    if (this.db) return this.db;
    const db = window.claude ? await window.claude.use('db') : null;
    if (!db) throw new Error('التخزين مش متاح في العرض الحالي.');
    this.db = db; return db;
  }
  async componentDidMount() {
    try { const t = window.localStorage.getItem('cgs-dark'); this.setState({ dark: t === null ? !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) : t === '1' }); } catch (e) {}
    try {
      let c = window.claude; for (let i = 0; !c && i < 40; i++) { await new Promise((r) => setTimeout(r, 250)); c = window.claude; }
      if (!c) return;
      const db = await this.getDb();
      db.collection('games').onSnapshot((snap) => {
        this.setState({ games: snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.at || 0) - (a.at || 0)) });
      });
      db.collection('settings').doc('site').onSnapshot((d) => {
        const v = d.exists ? d.data() : {};
        this.setState({ site: v, st: this.loadedSt ? this.state.st : v }); this.loadedSt = true;
      });
      this.assets = await c.use('assets');
    } catch (e) {}
  }
  setF(k, v) { this.setState({ f: { ...this.state.f, [k]: v } }); }
  setS(k, v) { this.setState({ st: { ...this.state.st, [k]: v } }); }
  renderVals() {
    const s = this.state, f = s.f, d = s.dark;
    const L = { bg: '#FBF0E4', ink: '#3B2B3F', soft: '#5B4A5E', card: '#FFF9F2', line: '#EBD9C4', chip: '#F3E3CF', accent: '#B8476A', accentink: '#FFFFFF', dark: '#3B2B3F', darkink: '#FFF9F2', panel: '#FFF3E0', panelline: '#E0B97A', field: '#FFF9F2', fieldline: '#E7D4BE', bad: '#F6D5D5', badink: '#7A2A2A', shadow: 'rgba(59,43,63,.14)', blob: '.55' };
    const D = { bg: '#1F1A26', ink: '#F3E9DD', soft: '#C4B8C8', card: '#2A2433', line: '#3D3448', chip: '#382F44', accent: '#F58FAE', accentink: '#2A1520', dark: '#F4C86A', darkink: '#2A2433', panel: '#2A2433', panelline: '#6B5A3A', field: '#201A29', fieldline: '#4C4259', bad: '#5A2A33', badink: '#FFD9D9', shadow: 'rgba(0,0,0,.35)', blob: '.22' };
    const T = d ? D : L;
    const q = s.q.trim().toLowerCase();
    const list = s.games.filter((g) => (s.filter === 'all' || g.kind === s.filter) && (!q || (g.title + ' ' + (g.desc || '')).toLowerCase().includes(q)));
    const showAdmin = s.canEdit && s.admin && s.unlocked;
    const site = s.site || {};
    const so = [['انستجرام', site.ig], ['فيسبوك', site.fb], ['يوتيوب', site.yt], ['تيك توك', site.tt], ['جيميل', site.mail ? 'mailto:' + site.mail : '']].filter((x) => x[1]).map((x) => ({ name: x[0], href: x[1] }));
    const clear = { title: '', url: '', image: '', desc: '', kind: 'لعبة' };
    return {
      themeVars: Object.keys(T).map((k) => '--' + k + ':' + T[k]).join(';'),
      themeLabel: d ? 'وضع النهار' : 'وضع الليل',
      toggleTheme: () => { this.setState({ dark: !d }); try { window.localStorage.setItem('cgs-dark', d ? '0' : '1'); } catch (e) {} },
      q: s.q, onSearch: (e) => this.setState({ q: e.target.value }),
      canEdit: s.canEdit, showAdmin, editing: !!s.editingId, msg: s.msg, siteMsg: s.siteMsg,
      adminLabel: s.admin ? 'إغلاق لوحة التحكم' : 'لوحة التحكم',
      formTitle: s.editingId ? 'تعديل اللعبة' : 'أضف لعبة جديدة',
      saveLabel: s.editingId ? 'حفظ التعديل' : 'أضف اللعبة',
      askPw: s.askPw && !s.unlocked, pw: s.pw, pwMsg: s.pwMsg,
      onPw: (e) => this.setState({ pw: e.target.value }),
      unlock: async () => {
        try {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s.pw));
          const hex = Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
          if (hex === '98c76d81a48ba4ffd545396058a41bb7daf092b7ab14075d8e8d108d14bfa7c7') this.setState({ unlocked: true, admin: true, askPw: false, pw: '', pwMsg: '' });
          else this.setState({ pwMsg: 'الباسوورد غلط' });
        } catch (err) { this.setState({ pwMsg: 'مقدرناش نتحقق' }); }
      },
      toggleAdmin: () => { if (s.unlocked) this.setState({ admin: !s.admin, msg: '' }); else this.setState({ askPw: !s.askPw, pwMsg: '' }); },
      f: { ...f, isGame: f.kind === 'لعبة', isApp: f.kind === 'ويب اب' },
      onTitle: (e) => this.setF('title', e.target.value),
      onUrl: (e) => this.setF('url', e.target.value),
      onDesc: (e) => this.setF('desc', e.target.value),
      onKind: (e) => this.setF('kind', e.target.value),
      onFile: async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file || !this.assets) { this.setState({ msg: file ? 'رفع الصور مش متاح في العرض ده.' : '' }); return; }
        this.setState({ msg: 'بنرفع الصورة…' });
        try { const r = await this.assets.upload(file); this.setState({ f: { ...this.state.f, image: r.url }, msg: 'الصورة اترفعت.' }); }
        catch (err) { this.setState({ msg: 'الرفع فشل: ' + ((err && err.message) || 'جرّب صورة أصغر.') }); }
      },
      save: async () => {
        if (!f.title.trim() || !f.url.trim()) { this.setState({ msg: 'اكتب اسم اللعبة ورابطها الأول.' }); return; }
        const id = s.editingId || 'g' + Date.now();
        const old = s.games.find((g) => g.id === id);
        try {
          const db = await this.getDb();
          await db.collection('games').doc(id).set({ title: f.title.trim(), url: f.url.trim(), image: f.image || '', desc: f.desc.trim(), kind: f.kind, at: old ? old.at : Date.now() });
          this.setState({ editingId: null, msg: 'اتحفظت ✓', f: clear });
        } catch (err) { this.setState({ msg: 'مقدرناش نحفظ [' + ((err && (err.code || err.name)) || '') + '] ' + ((err && err.message) || '') }); }
      },
      cancelEdit: () => this.setState({ editingId: null, msg: '', f: clear }),
      st: { about: s.st.about || '', ig: s.st.ig || '', fb: s.st.fb || '', yt: s.st.yt || '', tt: s.st.tt || '', mail: s.st.mail || '' },
      onAbout: (e) => this.setS('about', e.target.value), onIg: (e) => this.setS('ig', e.target.value), onFb: (e) => this.setS('fb', e.target.value),
      onYt: (e) => this.setS('yt', e.target.value), onTt: (e) => this.setS('tt', e.target.value), onMail: (e) => this.setS('mail', e.target.value),
      saveSite: async () => {
        try { const db = await this.getDb(); await db.collection('settings').doc('site').set({ ...s.st }); this.setState({ siteMsg: 'اتحفظت ✓' }); }
        catch (err) { this.setState({ siteMsg: 'مقدرناش نحفظ: ' + ((err && err.message) || '') }); }
      },
      aboutText: site.about || 'أنا مطوّر ألعاب بحب أعمل ألعاب صغيرة وتطبيقات ويب مريحة. كل لعبة هنا اتعملت بحب، وبتتحدث باستمرار. لو عجبتك واحدة، قولّي رأيك.',
      socials: so,
      filters: [['all', 'الكل'], ['لعبة', 'ألعاب'], ['ويب اب', 'ويب اب']].map(([k, label]) => ({ label, style: s.filter === k ? 'background:var(--dark);color:var(--darkink)' : 'background:var(--chip);color:var(--ink)', pick: () => this.setState({ filter: k }) })),
      shown: list.map((g) => ({ ...g, hasImage: !!g.image,
        edit: () => this.setState({ editingId: g.id, msg: '', f: { title: g.title, url: g.url, image: g.image || '', desc: g.desc || '', kind: g.kind } }),
        remove: async () => { try { const db = await this.getDb(); await db.collection('games').doc(g.id).delete(); } catch (err) {} } })),
      empty: list.length === 0,
      emptyText: q ? 'مفيش لعبة بالاسم ده.' : (s.canEdit ? 'الرف فاضي. افتح لوحة التحكم وضيف أول لعبة.' : 'الألعاب جاية قريب…')
    };
  }
}
</script>
</body>
</html>
